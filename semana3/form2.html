<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso JavaScript</title>
    <script>
        function saludar(){
            let nombre = document.getElementById("txtnom").value
            document.getElementById("mensaje").innerText = "Bienvenido a mi Sitio Web " + nombre
        }
    </script>
</head>
<body>
    <h1>Formulario de Saludo</h1>
    <label for="">Escribir su nombre</label>
    <input type="text" name="txtnom" id="txtnom" />
    <button onclick="saludar()">Saludar</button>
    <p id="mensaje"></p>
</body>
</html>
