<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html {
            background-color: black;
        }

        body {
            width: 1000px;
            height: 800px;
            margin: auto;
            background-color: pink;
        }

        header {
            width: 1000px;
            height: 200px;
            background-color: yellow;
        }

        nav {
            width: 1000px;
            height: 50px;
            background-color: blue;
        }

        main{
            width: 1000px;
            height: 500px;
            background-color: green;
        }
        footer{
            width: 1000px;      
            height: 50px;
            background-color: orange;
        }

        section#banner{
            width: 800px;
            height: 200px;
            background-color: red;
            float: right;
        }

        section#logo{
            width: 200px;
            height: 200px;
            background-color: aquamarine;
            float: left;
        }

        article{
            width: 700px;
            height: 500px;
            background-color: lightblue;
            float: left;
        }

        aside#right{
            width: 300px;
            height: 500px;
            background-color: red;
            float: left;
        }
    </style>
</head>
<body>
    <header>
        <section id="banner">Banner</section>
        <section id="logo">Logo</section>
    </header>
    <nav>
        <a href="">Inicio</a>
        <a href="">Quiénes somos</a>
        <a href="">Productos</a>
        <a href="">Ofertas</a>
        <a href="">Contacto</a>
    </nav>
    <main>
        <article>Descripcion de los servicios</article>
        <aside id="right"></aside>
    </main>
    <footer></footer>
</body>

</html>
