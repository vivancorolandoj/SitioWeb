<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html {
            background-color: black;
        }

        body {
            width: 750px;
            height: 750px;
            margin: auto;
            background-color: pink;
        }

        header {
            width: 750px;
            height: 250px;
            background-color: yellow;
        }

        nav {
            width: 750px;
            height: 50px;
            background-color: blue;
        }

        main{
            width: 750px;
            height: 400px;
            background-color: green;
        }
        footer{
            width: 750px;
            height: 50px;
            background-color: orange;
        }

        section#banner{
            width: 500px;
            height: 250px;
            background-color: red;
            float: left;
        }

        section#logo{
            width: 250px;
            height: 125;
            background-color: aquamarine;
            float: left;
        }

        section#login{
            width: 250px;
            height: 125px;
            background-color: burlywood;
            float: left;
        }

        aside#left{
            width: 150px;
            height: 400px;
            background-color: purple;
            float: left;
        }

        article{
            width: 500px;
            height: 400px;
            background-color: lightblue;
            float: left;
        }

        aside#right{
            width: 100px;
            height: 400px;
            background-color: red;
            float: left;
        }
    </style>
</head>
<body>
    <header>
        <section id="banner"></section>
        <section id="logo"></section>
        <section id="login"></section>
    </header>
    <nav></nav>
    <main>
        <aside id="left"></aside>
        <article></article>
        <aside id="right"></aside>
    </main>
    <footer></footer>
</body>

</html>
