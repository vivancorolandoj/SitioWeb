
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html {
            background-color: black;
        }

        body {
            width: 1000px;
            height: 950px;
            margin: auto;
            background-color: pink;
        }


        nav {
            width: 1000px;
            height: 100px;
            background-color: blue;
        }

        #n1 {
            width: 200px;
            height: 100px;
            background-color: rgb(114, 4, 4);
            float: left;
        }

        #n2 {
            width: 200px;
            height: 100px;
            background-color: rgb(255, 234, 0);
            float: left;
        }

        #n3 {
            width: 200px;
            height: 100px;
            background-color: rgb(0, 255, 0);
            float: left;
        }

        #n4 {
            width: 200px;
            height: 100px;
            background-color: rgb(43, 0, 255);
            float: left;
        }

        #n5 {
            width: 200px;
            height: 100px;
            background-color: rgb(179, 0, 255);
            float: left;
        }


        header {
            width: 1000px;
            height: 300px;
            background-color: yellow;
        }

        section#banner {
            width: 800px;
            height: 300px;
            background-color: red;
            float: left;
        }

        #header-right {
            width: 200px;
            height: 300px;
            background-color: gray;
            float: right;
        }

        section#logo {
            width: 200px;
            height: 100px;
            background-color: aquamarine;
        }

        section#login {
            width: 200px;
            height: 100px;
            background-color: burlywood;
        }

        section#form {
            width: 200px;
            height: 100px;
            background-color: rgb(27, 3, 105);
        }


        main {
            width: 1000px;
            height: 500px;
            background-color: green;
        }

        aside#left {
            width: 200px;
            height: 500px;
            background-color: purple;
            float: left;
        }

        article {
            width: 500px;
            height: 500px;
            background-color: lightblue;
            float: left;
        }

        aside#right {
            width: 300px;
            height: 500px;
            background-color: rgb(6, 66, 101);
            float: left;
        }


        footer {
            width: 1000px;
            height: 50px;
            background-color: orange;
        }

    </style>
</head>

<body>

    <nav id="main-nav">
        <box id="n1">Inicio</box>
        <box id="n2">Quiénes somos</box>
        <box id="n3">Productos</box>
        <box id="n4">Ofertas</box>
        <box id="n5">Contacto</box>
    </nav>

    <header>
        <section id="banner">Banner</section>
        <div id="header-right">
            <section id="logo">Logo</section>
            <section id="login">Login</section>
            <section id="form">Form</section>
        </div>
    </header>

    <main>
        <aside id="left">Menu</aside>
        <article>Descripcion de los servicios</article>
        <aside id="right">Ofertas</aside>
    </main>

    <footer></footer>

</body>

</html>
